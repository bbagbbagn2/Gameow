name: Deploy Preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  pull_request:
    branches:
      - main

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 가져오기
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성(라이브러리) 설치
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Vercel CLI 설치
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: Vercel 환경 정보 가져오기
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: 프로젝트 빌드
        if: env.VERCEL_TOKEN != ''
        run: vercel build --token=$VERCEL_TOKEN

      - name: Vercel에 프로젝트 배포
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN

      - name: Vercel 배포 건너뛰기
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret is unavailable. Skipping preview deployment."
